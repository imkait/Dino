<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTHS 跑酷遊戲</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Endless runner</p>
        <h1>NTHS 跑酷遊戲</h1>
      </div>
      <p class="intro">跳過障礙，保持節奏。每一次落地，都是下一次起跳的準備。</p>
    </header>

    <section class="game-frame" aria-label="Dino 跑酷遊戲">
      <div class="hud">
        <div class="status"><span class="status-dot" aria-hidden="true"></span><span id="statusText">準備出發</span></div>
        <div class="scores">
          <span>分數 <strong class="score-value" id="scoreText">00000</strong></span>
          <span>最高 <strong class="score-value" id="bestText">00000</strong></span>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="360" aria-label="遊戲畫面，點擊或按空白鍵跳躍"></canvas>
      </div>
      <div class="hint">
        <span><button class="key-button" type="button" data-jump aria-label="跳躍">Space</button> <button class="key-button" type="button" data-jump aria-label="跳躍">↑</button> 跳躍</span>
        <span>點擊畫面也可以開始或跳躍</span>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
